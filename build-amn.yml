              if not p.exists():
                  raise SystemExit(f"AMN SUB PATCH FAILED: missing {path}")
              t = p.read_text(encoding="utf-8")
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f"AMN SUB PATCH FAILED: {label} (found {n} matches, expected 1)")
              p.write_text(t.replace(old, new, 1), encoding="utf-8")

          KT = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui"
          U = "dev.cluvex.zedsecure.ui.components"

          # ---- strings (en / fa / ru / zh)
          S = {
            "values": ("Used", "Left", "Total", "Unlimited", "No expiry"),
            "values-fa": ("مصرف‌شده", "باقی‌مانده", "حجم کل", "نامحدود", "بدون انقضا"),
            "values-ru": ("Использовано", "Осталось", "Всего", "Безлимит", "Без срока"),
            "values-zh": ("已用", "剩余", "总计", "无限", "永久有效"),
          }
          for folder, (u, l, t_, unl, ne) in S.items():
              p = Path(f"shared/src/commonMain/composeResources/{folder}/strings.xml")
              if not p.exists():
                  continue
              txt = p.read_text(encoding="utf-8")
              if "sub_usage_used" in txt:
                  continue
              block = (
                  f'    <string name="sub_usage_used">{u}</string>\n'
                  f'    <string name="sub_usage_left">{l}</string>\n'
                  f'    <string name="sub_usage_total">{t_}</string>\n'
                  f'    <string name="sub_usage_unlimited">{unl}</string>\n'
                  f'    <string name="sub_usage_no_expiry">{ne}</string>\n'
              )
              idx = txt.rindex("</resources>")
              p.write_text(txt[:idx] + block + txt[idx:], encoding="utf-8")

          # ---- MainScaffold: resolve the quota of the active profile (also in Auto-config mode)
          patch(KT + "/MainScaffold.kt",
                "                    design = settings.appDesign,\n                    contentPadding = innerPadding,",
                "                    design = settings.appDesign,\n"
                f"                    subUsage = {U}.resolveSubUsage(activeProfile, subscriptions, profiles, autoSession),\n"
