          patch(H,
                "                    onClick = onBrowseConfigs,\n                    personalization = personalization,\n                )\n"
                "                Spacer(Modifier.height(if (compact) 8.dp else 14.dp))\n                when (connectStyle) {",
                "                    onClick = onBrowseConfigs,\n                    personalization = personalization,\n                )\n"
                "                subUsage?.let { u ->\n"
                "                    Spacer(Modifier.height(6.dp))\n"
                "                    val customBg = personalization.configCardColor\n"
                "                    val bg = customBg ?: MaterialTheme.colorScheme.surfaceContainerHigh\n"
                "                    val fg = personalization.configCardTextColor\n"
                "                        ?: customBg?.let { if (it.luminance() > 0.5f) androidx.compose.ui.graphics.Color(0xFF111318) else androidx.compose.ui.graphics.Color(0xFFF5F6FA) }\n"
                "                        ?: MaterialTheme.colorScheme.onSurface\n"
