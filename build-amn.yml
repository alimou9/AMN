          # ---- Core: if the first response had no quota headers, probe other User-Agents for them
          C = "shared/src/commonMain/kotlin/dev/cluvex/zedsecure/data/config/ConfigRepository.kt"
          patch(C,
                "            previous.firstOrNull { it.id == previousActive && SingBoxOnlyServers.isPlaceholder(it) }?.let { old ->",
